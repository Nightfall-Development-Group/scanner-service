[package]
name = "scanner-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
directories = "6.0.0"
lru = "0.18.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "gzip", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
