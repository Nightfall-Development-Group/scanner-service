name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so portability problems surface here rather than
  # in a release.
  RUSTFLAGS: -D warnings

jobs:
  # The point of the matrix is that Windows and macOS are compiled and tested on
  # real runners. Cross-compiling from Linux cannot verify them: rustls needs a
  # C toolchain for the target, and macOS additionally needs Apple's SDK.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Linux needs the windowing and GPU headers eframe links against. Not
      # required for scanner-core, but the app crate will not build without them.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --workspace --all-targets

      # The offline suite is hermetic: no network, no display. Live API tests are
      # #[ignore]d and are not run here, because CI has no key.
      - name: Test
        run: cargo test --workspace

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
